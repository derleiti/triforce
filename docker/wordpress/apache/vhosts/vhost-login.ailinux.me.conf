# Login Portal — standalone AILinux/TriForce auth frontend
<VirtualHost *:80>
  ServerName login.ailinux.me
  RewriteEngine On
  RewriteRule ^/(.*)$ https://login.ailinux.me/$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
  ServerName login.ailinux.me

  SSLEngine on
  SSLCertificateFile /etc/letsencrypt/live/ailinux.me/fullchain.pem
  SSLCertificateKeyFile /etc/letsencrypt/live/ailinux.me/privkey.pem

  DocumentRoot /var/www/login.ailinux.me
  DirectoryIndex index.html

  <Directory /var/www/login.ailinux.me>
    Require all granted
    AllowOverride None
    Options -Indexes
  </Directory>

  Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' https://api.ailinux.me; frame-src https://accounts.google.com https://*.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests"

  ErrorLog /proc/self/fd/2
  CustomLog /proc/self/fd/1 combined
</VirtualHost>
