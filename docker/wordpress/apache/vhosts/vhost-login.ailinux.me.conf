# Login Portal — standalone AILinux/TriForce auth frontend
<VirtualHost *:80>
  ServerName login.ailinux.me
  RewriteEngine On
  RewriteRule ^/(.*)$ https://login.ailinux.me/$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
  ServerName login.ailinux.me

  SSLEngine on
  SSLCertificateFile /etc/letsencrypt/live/ailinux.me/fullchain.pem
  SSLCertificateKeyFile /etc/letsencrypt/live/ailinux.me/privkey.pem


  # Password reset compatibility: static login frontend delegates reset flow to WordPress.
  RewriteEngine On
  RewriteRule ^/reset/?$ https://ailinux.me/wp-login.php?action=lostpassword\&ailinux_wp_admin=1 [R=302,L,NE]
  RewriteRule ^/password-reset/?$ https://ailinux.me/wp-login.php?action=lostpassword\&ailinux_wp_admin=1 [R=302,L,NE]
  RewriteRule ^/forgot-password/?$ https://ailinux.me/wp-login.php?action=lostpassword\&ailinux_wp_admin=1 [R=302,L,NE]

  DocumentRoot /var/www/login.ailinux.me
  DirectoryIndex index.html

  <Directory /var/www/login.ailinux.me>
    Require all granted
    AllowOverride None
    Options -Indexes
  </Directory>

  Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com https://apis.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com https://www.gstatic.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' https://api.ailinux.me https://ailinux.me https://accounts.google.com; frame-src https://accounts.google.com https://*.google.com; object-src 'none'; base-uri 'self'; form-action 'self' https://ailinux.me; frame-ancestors 'self' https://ailinux.me https://www.ailinux.me; upgrade-insecure-requests"

  # This login UI is intentionally embedded by ailinux.me only.
  Header always unset X-Frame-Options
  Header always unset Cross-Origin-Resource-Policy
  Header always set Cross-Origin-Resource-Policy "cross-origin"
  Header always unset Permissions-Policy
  Header always set Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), identity-credentials-get=(self)"

  # Google Identity Services popup must retain its opener relationship.
  Header always unset Cross-Origin-Opener-Policy
  Header always set Cross-Origin-Opener-Policy "same-origin-allow-popups"

  ErrorLog /proc/self/fd/2
  CustomLog /proc/self/fd/1 combined
</VirtualHost>
