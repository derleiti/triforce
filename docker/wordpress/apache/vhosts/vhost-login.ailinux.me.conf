# Login Portal — Redirect to WordPress Account Suite
# Migrated 2026-03-31: standalone HTML → WordPress /account/ page
<VirtualHost *:80>
  ServerName login.ailinux.me
  RewriteEngine On
  RewriteRule ^/(.*)$ https://ailinux.me/account/ [R=301,L]
</VirtualHost>

<VirtualHost *:443>
  ServerName login.ailinux.me

  SSLEngine on
  SSLCertificateFile /etc/letsencrypt/live/ailinux.me/fullchain.pem
  SSLCertificateKeyFile /etc/letsencrypt/live/ailinux.me/privkey.pem

  RewriteEngine On
  # Preserve ?tab=register, ?view=profile etc.
  RewriteCond %{QUERY_STRING} ^$
  RewriteRule ^/(.*)$ https://ailinux.me/account/ [R=301,L]
  RewriteCond %{QUERY_STRING} !^$
  RewriteRule ^/(.*)$ https://ailinux.me/account/?%{QUERY_STRING} [R=301,L]

  ErrorLog /proc/self/fd/2
  CustomLog /proc/self/fd/1 combined
</VirtualHost>
