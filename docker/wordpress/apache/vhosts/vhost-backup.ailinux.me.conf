# ============================================================================
# VHost für backup.ailinux.me
# Proxied via Hetzner Apache (TLS termination here, forward to backup VPS)
# Updated: 2026-03-11
# ============================================================================

<VirtualHost *:80>
  ServerName backup.ailinux.me
  RewriteEngine On
  RewriteRule ^/(.*)$ https://backup.ailinux.me/$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
  ServerName backup.ailinux.me

  SSLEngine on
  SSLCertificateFile      /etc/letsencrypt/live/ailinux.me/fullchain.pem
  SSLCertificateKeyFile   /etc/letsencrypt/live/ailinux.me/privkey.pem
  IncludeOptional conf.d/snippets/ssl-params.conf

  # Static mirror/shared_keys - served from backup VPS via proxy
  # Backup VPS: 5.104.107.103:80 (nginx serving /home/backupuser/mirror/)
  ProxyPreserveHost Off
  ProxyPass /mirror/ http://5.104.107.103/mirror/
  ProxyPassReverse /mirror/ http://5.104.107.103/mirror/

  # Health endpoint
  ProxyPass /health http://5.104.107.103/health
  ProxyPassReverse /health http://5.104.107.103/health

  # TriForce API on backup node
  ProxyPass /v1/ http://5.104.107.103:9000/v1/
  ProxyPassReverse /v1/ http://5.104.107.103:9000/v1/

  RequestHeader set X-Forwarded-Proto "https"
  RequestHeader set X-Forwarded-Port "443"

  <IfModule mod_headers.c>
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
    Header always set X-Frame-Options "DENY"
    Header always set X-Content-Type-Options "nosniff"
    Header always unset X-Powered-By
  </IfModule>

  Protocols h2 http/1.1
  ErrorLog  "/proc/self/fd/2"
  CustomLog "/proc/self/fd/1" realip
</VirtualHost>
