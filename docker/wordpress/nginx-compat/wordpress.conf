map $request_uri $skip_cache {
    default 0;
    ~*wp-admin 1;
    ~*wp-login 1;
    ~*/xmlrpc.php 1;
    ~*/wp-cron.php 1;
    ~*\?s= 1;
}
map $http_cookie $skip_cache_cookie {
    default 0;
    ~*wordpress_logged_in 1;
    ~*comment_author 1;
}
upstream wordpress_fpm_upstream {
    server wordpress_fpm:9000;
    keepalive 32;
}
server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.php index.html;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    client_max_body_size 256m;

    location ~* \.(jpg|jpeg|png|gif|webp|avif|ico|svg|css|js|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }
    location ~* /wp-content/uploads/.*\.php$ { deny all; }
    location / { try_files $uri $uri/ /index.php?$args; }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass wordpress_fpm_upstream;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTPS on;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 32k;
        fastcgi_connect_timeout 30s;
        fastcgi_read_timeout 300s;
        fastcgi_keep_conn on;
        fastcgi_cache WORDPRESS;
        fastcgi_cache_valid 200 301 302 10m;
        fastcgi_cache_valid 404 1m;
        fastcgi_cache_bypass $skip_cache $skip_cache_cookie;
        fastcgi_no_cache $skip_cache $skip_cache_cookie;
        fastcgi_cache_key "$scheme$request_method$host$request_uri";
        add_header X-FastCGI-Cache $upstream_cache_status;
    }
    location ~ ^/(fpm-status|fpm-ping)$ {
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        deny all;
        fastcgi_pass wordpress_fpm_upstream;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
    location ~* \.(git|env|log|sql|bak|swp)$ { deny all; }
    location = /wp-config.php { deny all; }
    location ~ /\. { deny all; }
}
