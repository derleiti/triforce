---
# Codacy configuration
# Docs: https://docs.codacy.com/repositories-configure/codacy-configuration-file/

exclude_paths:
  # Debug/temp dirs
  - ".debug/**"
  - ".backups/**"
  - ".repair-backup/**"
  - ".patch-bak/**"
  # Agent / config dirs ohne ESLint-Setup
  - "agent/**"
  - "config/**"
  # Agent launcher symlinks (point to /root/.npm-global/ — broken on CI)
  - "bin/**"
  # Webui (vanilla JS, kein eslintrc)
  - "webui/**"
  # Docker vendor & WP-spezifische Dirs
  - "docker/repository/**"
  - "docker/wordpress/html/wp-content/plugins/**/vendor/**"
  # WordPress plugin vendored deps (often contain non-UTF-8 charset tables, binaries)
  - "docker/wordpress/html/wp-content/plugins/**/vendor-prefixed/**"
  - "docker/wordpress/html/wp-content/plugins/**/vendor_prefixed/**"
  - "docker/wordpress/html/wp-content/plugins/**/lib/vendor/**"
  - "docker/wordpress/html/wp-content/plugins/**/3rd-party/**"
  - "docker/wordpress/html/wp-content/plugins/**/languages/**"
  - "docker/wordpress/html/wp-content/themes/**/vendor-prefixed/**"
  - "docker/wordpress/html/wp-content/themes/**/vendor/**"
  - "docker/wordpress/html/wp-content/plugins/nova-ai-frontend/admin/**"
  - "docker/wordpress/html/wp-content/plugins/nova-ai-frontend/assets/**"
  - "docker/wordpress/html/wp-content/plugins/nova-ai-frontend/frontend/**"
  # Client / venv / cache
  - "client-deploy/**"
  - ".venv/**"
  - "**/__pycache__/**"
  - "**/*.min.js"
  - "**/*.min.css"
  # Logs & debug files
  - "all-debug-messeges-*.sh"
  - "mcp_write_lock_debug_*.txt"
  - "time_up.log"
  - "*.log"

engines:
  # PMD schlaegt auf Python-Code fehl - deaktivieren
  pmd:
    enabled: false
  # ESLint nur wo .eslintrc vorhanden
  eslint:
    enabled: true
