name: Secret Scan

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout triggering revision
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --prune --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD

      - name: Install gitleaks 8.30.1
        shell: bash
        run: |
          set -Eeuo pipefail
          version='8.30.1'
          archive="gitleaks_${version}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          curl -fsSLO "${base}/${archive}"
          curl -fsSLO "${base}/gitleaks_${version}_checksums.txt"
          grep " ${archive}$" "gitleaks_${version}_checksums.txt" | sha256sum -c -
          tar -xzf "${archive}" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan triggering revision
        shell: bash
        run: gitleaks dir --redact --verbose .
