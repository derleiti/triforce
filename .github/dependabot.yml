# Dependabot-Konfiguration TriForce
# Die Vorlage stand bis 2026-07-14 mit package-ecosystem: "" im Repo -> ungueltig,
# Dependabot hat sie ignoriert bzw. unzuverlaessig verarbeitet.
version: 2
updates:
  # --- Python (requirements.txt im Repo-Root) ---
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      # pytest 9 vs. pytest-asyncio <9: einzeln gebumpt reisst das die Testsuite auseinander.
      pytest:
        patterns:
          - "pytest"
          - "pytest-*"
      # Server-Stack zusammen halten (uvicorn-Extras sind empfindlich, siehe requirements.txt)
      server:
        patterns:
          - "fastapi"
          - "uvicorn*"
          - "starlette"
          - "pydantic*"
      linters:
        patterns:
          - "ruff"
          - "black"
          - "mypy"
    ignore:
      # Wird bewusst gepinnt gehalten (Build-Bruch bei >=82)
      - dependency-name: "setuptools"
        versions: [">=82"]

  # --- Python Clients ---
  # Mehrere Manifest-Verzeichnisse in einem Block; so werden Desktop-, Android-
  # und gemeinsame Client-Abhaengigkeiten ebenfalls regelmaessig gepflegt.
  - package-ecosystem: "pip"
    directories:
      - "/client-deploy"
      - "/client-deploy/ailinux-desktop"
      - "/client-deploy/ailinux-android-app"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      clients:
        patterns:
          - "*"
    ignore:
      # KivyMD 2 removes widgets still used by the Android client
      # (MDRaisedButton/MDFlatButton/OneLineListItem/TwoLineListItem).
      - dependency-name: "kivymd"
        versions: [">=2"]

  # --- Tracked Node lockfile (n8n custom nodes) ---
  - package-ecosystem: "npm"
    directory: "/data/n8n/nodes"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3

  # --- Dockerfiles ---
  - package-ecosystem: "docker"
    directories:
      - "/agent"
      - "/docker/repository"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3

  # --- GitHub Actions Workflows ---
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns:
          - "*"
